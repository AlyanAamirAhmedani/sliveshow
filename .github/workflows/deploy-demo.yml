name: Deploy demo

on:
  push:
    branches: [main]
    paths:
      - 'jupyterlite-demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JupyterLite + sliveshow
        run: python -m pip install -r jupyterlite-demo/requirements.txt

      - name: Build the JupyterLite site
        working-directory: jupyterlite-demo
        run: jupyter lite build --contents content --output-dir _output

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jupyterlite-demo/_output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
