name: Deploy demo

on:
  push:
    branches: [main]
    paths:
      - 'jupyterlite-demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # xeus kernels are built into the browser via an emscripten-forge conda
      # environment, which jupyterlite-xeus creates by shelling out to
      # `micromamba`. setup-micromamba installs that binary (and gives us
      # python + pip), without which the build fails with
      # "micromamba is needed for creating the emscripten environment".
      - name: Set up build environment (micromamba + python)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lite-build
          create-args: >-
            python=3.12
            pip
          init-shell: bash

      - name: Install JupyterLite + sliveshow
        shell: bash -el {0}
        run: python -m pip install -r jupyterlite-demo/requirements.txt

      - name: Build the JupyterLite site
        shell: bash -el {0}
        working-directory: jupyterlite-demo
        run: jupyter lite build --contents content --output-dir _output

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jupyterlite-demo/_output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
